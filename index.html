<title>تمرین زمان‌های انگلیسی</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mu:#667085;--ac:#2f6fed;--bd:#e3e6ee;--ok:#e8f0ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,system-ui,sans-serif;line-height:1.6}
main{position:relative;max-width:640px;margin:0 auto;padding:calc(60px + env(safe-area-inset-top,0px)) 16px 84px}
h1{font-size:20px;margin:8px 0 4px}
p.s{color:var(--mu);margin:0 0 12px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
*{-webkit-tap-highlight-color:transparent}button,input,.chip{outline:none}.chip,button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:8px 14px;cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.go{background:var(--ac);color:#fff;border-color:var(--ac);width:100%;border-radius:12px;padding:12px;margin:8px 0;font-weight:bold}

.en{direction:ltr;text-align:left;font-size:20px;font-weight:600}

.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.sp{display:flex;gap:6px;margin-top:10px;direction:ltr;overflow-x:auto;padding-bottom:2px}
.sp button{padding:6px 10px;font-size:13px;flex:none}
.sp button.on{background:var(--ok);border-color:var(--ac);color:var(--ac);font-weight:bold}
.fa{margin-top:10px;padding:10px;background:var(--ok);border-radius:10px;display:none}

.act{background:#dff3e4;border-color:#8fd3a3;color:#1b1f2a}

.exb{background:#dc3545;border-color:#dc3545}

#ex{display:none;position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px))}

.qrow{display:flex;gap:8px;align-items:center;margin:10px 0}

.qen{direction:ltr;font-size:28px;font-weight:800;line-height:1.35}
.qfa{margin-top:14px;font-size:14px;color:var(--mu)}
.nv{flex:none;width:44px;height:44px;border-radius:12px;font-size:22px;font-weight:bold;padding:0}
#ex,#exOpen{display:none!important}

#selTxt{flex:1;text-align:center;color:#b45309;font-size:13px;font-weight:bold}
#menuBtn{font-size:22px;padding:2px 10px;line-height:1.3;border-radius:8px}
#menu{display:none;position:fixed;top:calc(52px + env(safe-area-inset-top,0px));left:10px;z-index:70;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:6px}
#menu button{border:0;background:none;padding:10px 14px;border-radius:8px;white-space:nowrap}
#pk{display:none;position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.45);align-items:center;justify-content:center;padding:16px}
.pkb{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;width:100%;max-width:420px}
#bn{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;gap:10px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--bd)}

#bn button.cur{background:#ead9f3;color:#1b1f2a}
#xp{display:none;position:fixed;left:0;right:0;top:calc(48px + env(safe-area-inset-top,0px));bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--bg);padding:10px 12px;overflow:auto}
.xcard{position:relative;height:calc(100% - 66px);min-height:300px;border:2px solid #9b1c1c;border-radius:6px;display:flex;flex-direction:column;padding:6px 42px 10px;background:var(--card)}
.xcnt{text-align:center;font-size:12px;color:var(--mu);min-height:18px}

.xres{text-align:center;font-size:14px;font-weight:bold;min-height:24px}
.xm{width:100%;height:40px;border:2px solid var(--tx);border-radius:6px;background:var(--card);font-weight:bold;padding:0}
.xs{position:absolute;top:50%;transform:translateY(-50%);width:28px;height:84px;border:2px solid var(--tx);border-radius:6px;background:var(--card);padding:0;font-size:18px;font-weight:bold}
.xs.r{right:6px}.xs.l{left:6px}
.xrow{display:flex;gap:8px;margin-top:10px}
.xrow button{flex:1;height:48px;border:2px solid #2b3fa0;border-radius:6px;background:var(--card);font-weight:bold;padding:0}
.xm.act,.xrow button.act{background:#dff3e4;border-color:#8fd3a3;color:#1b1f2a}
@media (prefers-color-scheme:dark){.xm.act,.xrow button.act{background:#23402e;border-color:#3f7a54;color:#eef0f6}#selTxt{color:#f0a35e}#bn button.cur{background:#3a2a4a;color:#eef0f6}}
:root{--u:calc(min(100vw,480px) / 688)}

.qmb{display:block;margin:calc(var(--u)*14) calc(var(--u)*20) 0;width:calc(100% - var(--u)*40);height:calc(var(--u)*56);border:2px solid #2fa8ee;border-radius:calc(var(--u)*20);background:rgba(10,45,100,.35);color:#fff;font-size:calc(var(--u)*26);font-weight:bold;padding:0}
.qmb.act{background:rgba(240,180,60,.22);border-color:#f0b43c;color:#fff}
.nb{height:calc(var(--u)*92);border-radius:calc(var(--u)*20);border:2px solid #2fa8ee;background:#06163a;color:#fff;padding:0;line-height:1.2}
.nb b{display:block;font-size:calc(var(--u)*30);font-weight:600}
#menuBtn{margin-right:auto;margin-left:0}
#xNum,.qd b{color:rgba(255,255,255,.5)}
.qc{background:linear-gradient(180deg,#062454,#04173a)}

.gb{padding:0 calc(var(--u)*13);gap:calc(var(--u)*6);overflow:hidden}
.gt{flex:1;min-width:0;white-space:nowrap;overflow:hidden}

  try{speechSynthesis.cancel()}catch(e){}
  if(!dkOn){dkOn=true;$("xDict").classList.add("wk");dkTok++;dkStage="ready";dkBtn("normal");dkBoxSet("آماده‌ای؟");dkView();return}
  if(dkStage==="ready"){dkRun();return}
  if(dkStage==="listen"){dkTok++;try{speechSynthesis.cancel()}catch(e){}$("xListen").classList.remove("tl");dkStage="paused";dkBoxSet("آماده‌ای؟");return}
  if(dkStage==="paused"){dkStop();return}
  if(dkStage==="write"){
    dkStage="reveal";dkBoxSet("حالا مقایسه کن.");dkBtn("next");dkView();return}
  if(dkStage==="reveal"){
    if(xI>=xItems.length-1){dkStop();return}
    xI++;dkStage="listen";dkBtn("normal");xDraw();dkRun();return}
};
["xListen","xSay","xPrac","xShad","xRev","xNext","xPrev"].forEach(id=>$(id).addEventListener("click",()=>{if(dkOn)dkStop()},true));
const xDraw3=xDraw;xDraw=function(){xDraw3();if(dkOn)dkView()};
const xStart3=xStart;xStart=function(){dkStop();xStart3()};
const xShow3=xShow;xShow=function(on){if(!on)dkStop();xShow3(on)};
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(dkOn)dkFitTitle()});
/* ===== working state for Review / Shadowing ===== */
const rsOff=()=>["xRev","xShad"].forEach(j=>$(j).classList.remove("wk"));
["xRev","xShad"].forEach(id=>{$(id).onclick=()=>{const b=$(id),on=!b.classList.contains("wk");rsOff();if(prOn)prStop();if(dkOn)dkStop();try{speechSynthesis.cancel()}catch(e){}if(on)b.classList.add("wk")}});
["xListen","xSay","xPrac","xDict","xNext","xPrev"].forEach(id=>$(id).addEventListener("click",rsOff,true));
const xStart5=xStart;xStart=function(){rsOff();xStart5()};
const xShow5=xShow;xShow=function(on){if(!on)rsOff();xShow5(on)};
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
upd();
